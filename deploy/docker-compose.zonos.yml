# Zonos TTS overlay – adds the GPU-accelerated Zonos service to the stack.
#
# Usage (combine with the main stack):
#   docker compose \
#     -f deploy/docker-compose.stack.yml \
#     -f deploy/docker-compose.zonos.yml \
#     --env-file deploy/.env \
#     up -d
#
# The overlay:
#   1. Builds and starts the Zonos sidecar (GPU-enabled).
#   2. Injects ZONOS_URL into the pincerx service so /tts routes to Zonos.

services:
  zonos:
    build:
      context: ../zonos
    ports:
      - "8000:8000"
    environment:
      # Optional: pass a Hugging Face token so model downloads are authenticated
      # (higher rate limits, more reliable).  Set HF_TOKEN in deploy/.env.
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - zonos_cache:/root/.cache/huggingface
      - zonos_voices:/app/voices
    restart: unless-stopped
    healthcheck:
      # Poll the /health endpoint; Python is always available in the PyTorch base image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Allow up to 2 minutes for the Zonos model to load before health checks begin.
      start_period: 120s

  pincerx:
    environment:
      ZONOS_URL: http://zonos:8000
    depends_on:
      zonos:
        condition: service_healthy

volumes:
  zonos_cache:
  zonos_voices:
